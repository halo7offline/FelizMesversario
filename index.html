<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Secreta 💕</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #f8a9c8, #fff0f6);
      overflow-x: hidden;
    }

    .screen {
      display: none;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .active {
      display: flex;
    }

    /* Pantalla de contraseña */
    .password-screen {
      flex-direction: column;
      position: relative;
    }

    .password-box {
      width: min(92vw, 430px);
      padding: 35px 25px;
      border: 3px solid #f06292;
      border-radius: 30px;
      background: rgba(255, 245, 250, 0.92);
      box-shadow: 0 0 30px rgba(236, 64, 122, .35);
    }

    .password-box h2 {
      color: #c2185b;
      margin: 0 0 15px;
      font-size: 28px;
    }

    .input-display {
      font-size: 25px;
      letter-spacing: 8px;
      color: #c2185b;
      font-weight: bold;
      margin: 20px 0;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
      justify-content: center;
    }

    .key {
      border: 0;
      border-radius: 14px;
      background: #f8bbd0;
      color: #ad1457;
      font-size: 20px;
      font-weight: bold;
      padding: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(173, 20, 87, .15);
      transition: .2s;
    }

    .key:hover {
      background: #f48fb1;
      transform: scale(1.06);
    }

    /* Carta */
    .letter-screen {
      padding: 15px;
      background: linear-gradient(135deg, #ffd6e7, #fff0f6);
    }

    .letter-image {
      display: block;
      width: min(100%, 1200px);
      max-height: 96vh;
      object-fit: contain;
      border-radius: 28px;
      box-shadow:
        0 0 25px rgba(236, 64, 122, .35),
        0 12px 40px rgba(173, 20, 87, .2);
    }

    @media (max-width: 600px) {
      .screen { padding: 12px; }
      .password-box { padding: 28px 18px; }
      .password-box h2 { font-size: 24px; }
      .letter-image {
        width: 100%;
        max-height: none;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- PRIMERA PANTALLA: CONTRASEÑA -->
  <div id="passwordScreen" class="screen password-screen active">
    <div class="password-box">
      <h2>🔒 Enter password</h2>

      <div class="input-display" id="inputDisplay">••••••</div>

      <div class="keypad">
        <button class="key" onclick="enterDigit('1')">1</button>
        <button class="key" onclick="enterDigit('2')">2</button>
        <button class="key" onclick="enterDigit('3')">3</button>

        <button class="key" onclick="enterDigit('4')">4</button>
        <button class="key" onclick="enterDigit('5')">5</button>
        <button class="key" onclick="enterDigit('6')">6</button>

        <button class="key" onclick="enterDigit('7')">7</button>
        <button class="key" onclick="enterDigit('9')">9</button>
        <button class="key" onclick="enterDigit('8')">8</button>

        <div></div>
        <button class="key" onclick="enterDigit('0')">0</button>
        <div></div>
      </div>
    </div>
  </div>

  <!-- SEGUNDA PANTALLA: CARTA + DIBUJO -->
  <div id="letterScreen" class="screen letter-screen">
    <img
      class="letter-image"
      src="carta-romantica.png"
      alt="Carta romántica de 6 meses"
    >
  </div>

  <script>
    const correctPassword = '130226';
    let input = '';

    function enterDigit(digit) {
      if (input.length < 6) {
        input += digit;
      }

      const display = document.getElementById('inputDisplay');
      display.textContent = input.padEnd(6, '•');

      if (input.length === 6) {
        if (input === correctPassword) {
          document.getElementById('passwordScreen').classList.remove('active');
          document.getElementById('letterScreen').classList.add('active');
        } else {
          alert('Contraseña incorrecta, intenta de nuevo');
          input = '';
          display.textContent = '••••••';
        }
      }
    }
  </script>

</body>
</html>
