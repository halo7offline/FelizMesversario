<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carta Secreta 💕</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd9eb,#ffb7d5,#ffd9eb);overflow-x:hidden}
.screen{display:none;min-height:100vh;justify-content:center;align-items:center;text-align:center}.active{display:flex}.password-screen{flex-direction:column;padding:25px}
.lock{font-size:55px;animation:float 2.5s ease-in-out infinite;filter:drop-shadow(0 0 12px white)}h2{color:#b71962;text-shadow:0 2px 10px white}
.input-display{font-size:28px;letter-spacing:9px;color:#b71962;margin:18px 0;font-weight:bold}.keypad{display:grid;grid-template-columns:repeat(3,65px);gap:10px}
.key{background:#ffffffb8;border:2px solid #f58fbd;color:#a9165b;border-radius:15px;font-size:20px;padding:15px;cursor:pointer;box-shadow:0 5px 15px #b9186229;transition:.2s}
.key:hover{transform:translateY(-3px) scale(1.05);background:white;box-shadow:0 0 18px white}
#notepadScreen{position:relative;padding:25px 12px;overflow:hidden}.letter-wrap{position:relative;width:min(1100px,96vw);animation:reveal .9s ease both}
.letter-image{display:block;width:100%;height:auto;border-radius:28px;box-shadow:0 0 18px white,0 0 45px #ff4ea08c,0 18px 45px #78003c40}
.sparkles,.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}.sparkle,.heart{position:absolute;opacity:0;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.sparkle{color:white;font-size:clamp(15px,2vw,28px);text-shadow:0 0 7px white,0 0 18px #ff75b5;animation-name:sparkleLoop;animation-duration:3.2s}
.heart{color:#ff4f9a;font-size:clamp(16px,2.5vw,34px);text-shadow:0 0 8px white,0 0 14px #ff6fae;animation-name:heartLoop;animation-duration:4s}
.s1{left:7%;top:12%;animation-delay:0s}.s2{left:28%;top:7%;animation-delay:1.1s}.s3{left:55%;top:10%;animation-delay:.5s}.s4{left:87%;top:17%;animation-delay:1.7s}.s5{left:16%;top:75%;animation-delay:2s}.s6{left:67%;top:84%;animation-delay:1.3s}.s7{left:91%;top:72%;animation-delay:2.5s}
.h1{left:4%;top:43%;animation-delay:1s}.big-heart{left:76%;top:48%;font-size:clamp(34px,5vw,62px);animation-delay:.9s;animation-duration:5s}.h2{left:42%;top:3%;animation-delay:2s}.h3{left:94%;top:43%;animation-delay:.4s}.h4{left:52%;top:92%;animation-delay:2.8s}.h5{left:20%;top:91%;animation-delay:1.6s}
@keyframes sparkleLoop{0%,100%{opacity:0;transform:scale(.3) rotate(0)}20%{opacity:1;transform:scale(1.2) rotate(25deg)}45%{opacity:.9;transform:scale(1) rotate(55deg)}70%{opacity:.2;transform:scale(.7) rotate(80deg)}}
@keyframes heartLoop{0%,100%{opacity:0;transform:translateY(15px) scale(.5) rotate(-8deg)}20%{opacity:.9;transform:translateY(0) scale(1) rotate(5deg)}55%{opacity:.7;transform:translateY(-12px) scale(1.1) rotate(-5deg)}80%{opacity:.15;transform:translateY(-25px) scale(.75) rotate(8deg)}}
@keyframes reveal{0%{opacity:0;transform:scale(.88);filter:brightness(1.8) blur(4px)}60%{opacity:1;transform:scale(1.02);filter:brightness(1.12) blur(0)}100%{opacity:1;transform:scale(1);filter:brightness(1) blur(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:600px){.keypad{grid-template-columns:repeat(3,58px)}.key{padding:13px}#notepadScreen{padding:12px 7px}.letter-image{border-radius:20px}}
</style>
</head>
<body>
<div id="passwordScreen" class="screen password-screen active">
<div class="lock">🔐</div><h2>💗 Carta secreta 💗</h2>
<div class="input-display" id="inputDisplay">••••••</div>
<div class="keypad">
<button class="key" onclick="enterDigit('1')">1</button><button class="key" onclick="enterDigit('2')">2</button><button class="key" onclick="enterDigit('3')">3</button>
<button class="key" onclick="enterDigit('4')">4</button><button class="key" onclick="enterDigit('5')">5</button><button class="key" onclick="enterDigit('6')">6</button>
<button class="key" onclick="enterDigit('7')">7</button><button class="key" onclick="enterDigit('8')">8</button><button class="key" onclick="enterDigit('9')">9</button>
<div></div><button class="key" onclick="enterDigit('0')">0</button><div></div>
</div></div>
<div id="notepadScreen" class="screen">
<div class="letter-wrap">
<img class="letter-image" src="carta-romantica.png" alt="Carta romántica">
<div class="sparkles"><span class="sparkle s1">✦</span><span class="sparkle s2">✧</span><span class="sparkle s3">✦</span><span class="sparkle s4">✧</span><span class="sparkle s5">✦</span><span class="sparkle s6">✧</span><span class="sparkle s7">✦</span></div>
<div class="hearts"><span class="heart h1">♡</span><span class="heart h2">♥</span><span class="heart h3">♡</span><span class="heart h4">♥</span><span class="heart h5">♡</span><span class="heart big-heart">♥</span></div>
</div></div>
<script>
const correctPassword='130226';let input='';
function enterDigit(digit){if(input.length<6)input+=digit;const d=document.getElementById('inputDisplay');d.textContent=input.padEnd(6,'•');if(input.length===6){if(input===correctPassword){document.getElementById('passwordScreen').classList.remove('active');document.getElementById('notepadScreen').classList.add('active')}else{alert('Contraseña incorrecta, intenta de nuevo 💗');input='';d.textContent='••••••'}}}
</script>
</body></html>
